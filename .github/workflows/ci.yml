name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Use a fake Firebase config for CI
        run: cp Resources/GoogleService-Info.ci.plist GoogleService-Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project TicoMarket.xcodeproj \
            -scheme TicoMarket \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot Simulator, install and launch the app
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 16 (" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "udid=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under build/Build/Products"
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" com.ticomarket.app
          sleep 5

      - name: Take a screenshot
        run: |
          mkdir -p screenshots
          xcrun simctl io "$udid" screenshot screenshots/sign-in-screen.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png
